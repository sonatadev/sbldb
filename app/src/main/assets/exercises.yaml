# Exercises and the joint actions they train, rated 1–5:
#   5 = one of the best choices for that action
#   4 = trains it directly
#   3 = trains it meaningfully as part of a compound lift
#   2 = involves it
#   1 = minor or stabilising role
# Muscles for volume are derived from the actions: PRIMARY when the muscle is a prime mover of an
# action rated 4 or 5, otherwise SECONDARY. An optional `muscles` block replaces the derivation.

