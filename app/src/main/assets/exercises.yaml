# ---------- Modern variations ----------
- name: Smith Machine Incline Press
  equipment: Machine
  note: Fixed bar path lets you push close to failure safely with the upper chest loaded at the stretch.
  actions: {Shoulder / Horizontal Adduction: 4, Shoulder / Flexion: 3, Elbow / Extension: 3}
- name: Deficit Push-Up
  equipment: Bodyweight
  note: Hands on plates add range, so the pecs work deeper into the stretch than a floor push-up.
  actions: {Shoulder / Horizontal Adduction: 4, Elbow / Extension: 3, Shoulder / Flexion: 2, Scapula / Protraction: 2}
- name: Seated Cable Fly
  equipment: Cable
  attachment: D-Handle
  note: Seated with back support removes stability demands; the cables load the pecs through the whole stretch.
  actions: {Shoulder / Horizontal Adduction: 5}
- name: Machine Fly
  equipment: Machine
  note: Set the handles so the arms start well behind the torso for a deep, loaded stretch.
  actions: {Shoulder / Horizontal Adduction: 5}
- name: Cable Press-Around
  equipment: Cable
  attachment: D-Handle
  note: Hits the fully shortened, arms-crossed position; pair it with a stretch-focused press or fly.
  actions: {Shoulder / Horizontal Adduction: 4}
- name: Lean-Away Cable Lateral Raise
  equipment: Cable
  attachment: D-Handle
  note: Leaning away shifts peak tension to the bottom, where the side delt is lengthened.
  actions: {Shoulder / Abduction: 5}
- name: Behind-the-Back Cable Lateral Raise
  equipment: Cable
  attachment: D-Handle
  note: Cable from behind the body pre-stretches the side delt at the start of each rep.
  actions: {Shoulder / Abduction: 5}
- name: Cable Y-Raise
  equipment: Cable
  attachment: D-Handle
  note: Raising in the plane of the shoulder blade trains side delts and lower traps together.
  actions: {Shoulder / Abduction: 4, Scapula / Upward Rotation: 4}
- name: Lying Incline Dumbbell Lateral Raise
  equipment: Dumbbell
  note: Lying sideways on an incline bench moves the hardest point to the stretched bottom range.
  actions: {Shoulder / Abduction: 4}
- name: Cross-Body Cable Rear Delt Fly
  equipment: Cable
  note: Crossed cables start the rear delts from a stretch and keep tension through the full arc.
  actions: {Shoulder / Horizontal Abduction: 5}
- name: Chest-Supported Rear Delt Row
  equipment: Dumbbell
  note: Elbows flared at 90° on an incline bench bias the rear delts and mid traps over the lats.
  actions: {Shoulder / Horizontal Abduction: 4, Scapula / Retraction: 4, Elbow / Flexion: 2}
- name: Kneeling Single-Arm Lat Pulldown
  equipment: Cable
  attachment: D-Handle
  note: One arm at a time lets the lat reach a full overhead stretch and pull straight down in line with its fibers.
  actions: {Shoulder / Adduction: 5, Shoulder / Extension: 3, Elbow / Flexion: 3, Scapula / Depression: 3}
- name: Single-Arm Cable Row (Lat Focus)
  equipment: Cable
  attachment: D-Handle
  note: Pull toward the hip with a forward reach at the start to stretch and load the lat.
  actions: {Shoulder / Extension: 5, Elbow / Flexion: 3, Scapula / Retraction: 2}
- name: Cable Lat Prayer
  equipment: Cable
  attachment: Rope
  note: Straight-arm shoulder extension that isolates the lats without the biceps limiting the set.
  actions: {Shoulder / Extension: 5}
- name: Machine Pullover
  equipment: Machine
  note: Loads the lats from a deep overhead stretch with no grip or biceps involvement.
  actions: {Shoulder / Extension: 5}
- name: Meadows Row
  equipment: Barbell
  note: Landmine row with a staggered stance; the long range loads the lats and upper back at the stretch.
  actions: {Shoulder / Extension: 4, Scapula / Retraction: 3, Shoulder / Horizontal Abduction: 3, Elbow / Flexion: 3}
- name: Kroc Row
  equipment: Dumbbell
  note: Heavy, higher-rep one-arm row with a bit of body english to extend the set past failure.
  actions: {Shoulder / Extension: 4, Scapula / Retraction: 3, Elbow / Flexion: 3, Scapula / Elevation: 2}
- name: Pendlay Row
  equipment: Barbell
  note: Each rep starts dead from the floor, forcing a strict pull with the torso parallel.
  actions: {Shoulder / Extension: 4, Scapula / Retraction: 4, Elbow / Flexion: 3, Spine / Extension: 3, Shoulder / Horizontal Abduction: 2}
- name: Helms Row
  equipment: Dumbbell
  note: Chest braced on a bench, elbows out; strict upper-back work with no lower-back fatigue.
  actions: {Scapula / Retraction: 4, Shoulder / Horizontal Abduction: 4, Elbow / Flexion: 3, Shoulder / Extension: 3}
- name: Seal Row
  equipment: Barbell
  note: Lying face-down on a high bench removes all momentum and lower-back strain.
  actions: {Scapula / Retraction: 5, Shoulder / Extension: 4, Elbow / Flexion: 3, Shoulder / Horizontal Abduction: 3}
- name: Assisted Pull-Up Machine
  equipment: Machine
  note: Lets you take vertical pulls close to failure at any strength level.
  actions: {Shoulder / Adduction: 4, Shoulder / Extension: 3, Elbow / Flexion: 3, Scapula / Depression: 3, Scapula / Downward Rotation: 3}
- name: Kelso Shrug
  equipment: Dumbbell
  note: Chest-supported shrug pulling the shoulder blades back, targeting the mid traps and rhomboids.
  actions: {Scapula / Retraction: 5}
- name: Spider Curl
  equipment: Dumbbell
  note: Chest on an incline bench; hardest at the top, so it complements stretch-focused curls.
  actions: {Elbow / Flexion: 4}
- name: Preacher Curl Machine
  equipment: Machine
  note: A good machine keeps tension in the stretched bottom range where the biceps grow most.
  actions: {Elbow / Flexion: 5}
- name: Cable Rope Hammer Curl
  equipment: Cable
  attachment: Rope
  note: Neutral grip shifts work to the brachialis and brachioradialis with constant cable tension.
  actions: {Elbow / Flexion: 4}
  muscles:
    primary: [Brachialis, Brachioradialis]
    secondary: [Biceps]
- name: Cross-Body Cable Triceps Extension
  equipment: Cable
  note: Single-arm extension across the body, comfortable on the elbow and easy to push to failure.
  actions: {Elbow / Extension: 5}
- name: Single-Arm Overhead Cable Extension
  equipment: Cable
  attachment: D-Handle
  note: Overhead single-arm version for a deep long-head stretch without the elbows flaring.
  actions: {Elbow / Extension: 5}
- name: JM Press
  equipment: Barbell
  note: Hybrid of close-grip press and skull crusher that lets the triceps handle heavy loads.
  actions: {Elbow / Extension: 5, Shoulder / Horizontal Adduction: 2}
- name: Pendulum Squat
  equipment: Machine
  note: Arc path keeps the torso upright and the quads loaded deep in knee flexion.
  actions: {Knee / Extension: 5, Hip / Extension: 3}
  muscles:
    primary: [Quadriceps / Vastus Lateralis, Quadriceps / Vastus Medialis, Quadriceps / Vastus Intermedius]
    secondary: [Quadriceps / Rectus Femoris, Glutes / Gluteus Maximus, Adductors / Adductor Magnus]
- name: Belt Squat
  equipment: Machine
  note: Load hangs from the hips, so legs train to failure without the spine being the limit.
  actions: {Knee / Extension: 5, Hip / Extension: 4}
  muscles:
    primary: [Quadriceps / Vastus Lateralis, Quadriceps / Vastus Medialis, Quadriceps / Vastus Intermedius, Glutes / Gluteus Maximus, Adductors / Adductor Magnus]
    secondary: [Quadriceps / Rectus Femoris, Hamstrings]
- name: Smith Machine Squat
  equipment: Machine
  note: Feet slightly forward and a fixed path let you squat deep and safe near failure.
  actions: {Knee / Extension: 5, Hip / Extension: 3}
  muscles:
    primary: [Quadriceps / Vastus Lateralis, Quadriceps / Vastus Medialis, Quadriceps / Vastus Intermedius]
    secondary: [Quadriceps / Rectus Femoris, Glutes / Gluteus Maximus, Adductors / Adductor Magnus]
- name: Heel-Elevated Goblet Squat
  equipment: Dumbbell
  note: Raised heels allow more forward knee travel and depth, biasing the quads.
  actions: {Knee / Extension: 4, Hip / Extension: 3}
  muscles:
    primary: [Quadriceps / Vastus Lateralis, Quadriceps / Vastus Medialis, Quadriceps / Vastus Intermedius]
    secondary: [Quadriceps / Rectus Femoris, Glutes / Gluteus Maximus, Adductors / Adductor Magnus]
- name: Sissy Squat
  equipment: Bodyweight
  note: Hips stay extended while the knees bend, putting the rectus femoris under a big stretch.
  actions: {Knee / Extension: 5}
- name: Deficit Reverse Lunge
  equipment: Dumbbell
  note: Stepping back from a raised platform deepens hip flexion for more glute and adductor stretch.
  actions: {Hip / Extension: 5, Knee / Extension: 3, Hip / Abduction: 2}
  muscles:
    primary: [Glutes / Gluteus Maximus, Adductors / Adductor Magnus]
    secondary: [Quadriceps, Hamstrings, Glutes / Gluteus Medius/Minimus]
- name: Stiff-Leg Deadlift
  equipment: Barbell
  note: Straighter knees than an RDL push the hamstrings further into the stretch.
  actions: {Hip / Extension: 5, Spine / Extension: 3}
- name: B-Stance RDL
  equipment: Dumbbell
  note: Kickstand stance loads one leg at a time with less balance demand than a single-leg RDL.
  actions: {Hip / Extension: 5}
- name: 45° Hip Extension (Glute Bias)
  equipment: Bodyweight
  note: Round the upper back and turn the feet out to shift the work from the lower back to the glutes.
  actions: {Hip / Extension: 5, Spine / Extension: 2}
  muscles:
    primary: [Glutes / Gluteus Maximus]
    secondary: [Hamstrings, Adductors / Adductor Magnus, Erector Spinae]
- name: Cable Glute Kickback
  equipment: Cable
  attachment: Ankle Strap
  note: Lean forward so the glute starts from a stretch with the hip flexed.
  actions: {Hip / Extension: 4}
  muscles:
    primary: [Glutes / Gluteus Maximus]
    secondary: [Hamstrings]
- name: Standing Single-Leg Curl
  equipment: Machine
  note: One leg at a time, with a slight forward lean to lengthen the hamstrings.
  actions: {Knee / Flexion: 4}
- name: Glute-Ham Raise
  equipment: Bodyweight
  note: Trains the hamstrings at both the knee and the hip in one movement.
  actions: {Knee / Flexion: 5, Hip / Extension: 3}
- name: Donkey Calf Raise
  equipment: Machine
  note: Hips flexed and knees straight give the gastrocnemius its deepest stretch.
  actions: {Ankle / Plantarflexion: 5}
  muscles:
    primary: [Calves / Gastrocnemius]
    secondary: [Calves / Soleus]
- name: Machine Crunch
  equipment: Machine
  note: Easy to load progressively, which bodyweight crunches are not.
  actions: {Spine / Flexion: 5}
- name: Weighted Decline Sit-Up
  equipment: Bodyweight
  note: The decline and load make the abs work through a long range under real tension.
  actions: {Spine / Flexion: 4, Hip / Flexion: 4}
- name: Stability Ball Crunch
  equipment: Bodyweight
  note: The ball lets the spine extend past neutral, so the abs work from a stretch.
  actions: {Spine / Flexion: 5}
