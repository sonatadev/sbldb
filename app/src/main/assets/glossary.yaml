# Terms a beginner meets in the app, each explained twice (basic / expert).

- term: Joint action
  basic: A single way a joint can move, like bending the elbow or lifting the arm to the side. Every exercise is made of one or more joint actions.
  expert: A rotation of one joint in one plane. Classifying exercises by joint action shows which muscles they can load and makes it easy to cover all of them.
- term: Prime mover
  basic: A "main muscle" for a movement, the one doing most of the work.
  expert: The agonist with the largest share of torque for that joint action; in this app, prime movers of directly trained actions (rated 4–5) count as a full set for volume.
- term: Helper
  basic: A muscle that assists the main muscle but does less of the work.
  expert: A synergist. In this app, helpers count as half a set for weekly volume.
- term: Hard set
  basic: A set you take close to the point where you could not do another rep. These are the sets that make muscles grow.
  expert: A working set taken to within about 0–4 reps in reserve. Warm-ups and easier sets are excluded from volume.
- term: RIR
  basic: Reps in reserve, meaning how many more reps you could have done before failing. RIR 0 means you could not do another one.
  expert: A proximity-to-failure scale; RIR 0–3 gives similar growth for most people, and very easy sets add little.
- term: Volume
  basic: How much training a muscle gets, counted as hard sets per week.
  expert: Weekly hard sets per muscle, with fractional counting for helpers. The best-supported driver of hypertrophy you can control.
- term: Zone 10–20
  basic: A good weekly target for most people, between 10 and 20 hard sets per muscle.
  expert: A practical range from dose-response meta-analyses; gains keep rising with volume but with diminishing returns and higher fatigue at the top.
- term: Frequency
  basic: How many days a week you train a muscle. Two or more is usually better than one.
  expert: Splitting weekly volume across two or more sessions keeps set quality high; frequency matters mostly through its effect on volume.
- term: Stretched position
  basic: The part of a movement where the muscle is at its longest, like the bottom of a fly.
  expert: Long muscle lengths under load; exercises that load the stretched position tend to grow muscles more, which is why many ratings favor them.
- term: Compound
  basic: An exercise that moves several joints at once, like a squat or a row.
  expert: A multi-joint exercise; efficient but usually loads each muscle less directly than an isolation exercise.
- term: Isolation
  basic: An exercise that moves one joint, like a curl or a leg extension.
  expert: A single-joint exercise that targets specific muscles and is easy to take close to failure.
- term: Rating
  basic: The dots next to an exercise show how good it is for that joint action, from 1 (barely involved) to 5 (one of the best choices).
  expert: A judgement of how directly and heavily the exercise loads the action through a full range, favouring load in the stretched position. Ratings 4–5 count as direct training for volume.
- term: e1RM
  basic: Your estimated one-rep max, meaning the most weight you could probably lift once, calculated from a set of several reps.
  expert: Epley estimate (weight × (1 + reps/30)), computed only for sets of 12 reps or fewer, where it is reasonably accurate.
- term: Progressive overload
  basic: Doing a little more over time, like adding weight or reps, so your muscles keep having a reason to grow.
  expert: Gradually increasing load, reps or sets at a similar RIR; the "last time" numbers in a workout help you beat your previous session.
- term: Warm-up set
  basic: A light set before your working sets to get ready. It does not count toward volume.
  expert: Submaximal sets far from failure; marked with W and excluded from all volume and e1RM calculations. Tap the set number to change a set's type.
- term: Drop set
  basic: Right after a hard set you lower the weight and keep going with no rest. Marked D. It counts as a set, but not for records or progression.
  expert: An extra near-failure set at a reduced load with minimal rest; a time-efficient way to add volume. Counted as a hard set, excluded from PRs and the progression suggestion because the load is deliberately lighter.
- term: Myo-reps
  basic: One hard set, then a few short sets with only a few breaths of rest between them. Marked M.
  expert: An activation set near failure followed by mini-sets of 3–5 reps on 10–20 s rests; each logged set counts as a hard set.
- term: Lengthened partials
  basic: Reps done only in the stretched half of the movement, usually after you can't do full reps any more. Marked P.
  expert: Partial range reps biased to long muscle lengths, often used past full-range failure; research suggests growth similar to or better than full range. Excluded from records because the range is shorter.
- term: To failure
  basic: A set where you could not do another rep with good form. Marked F, the same as RIR 0.
  expert: Momentary muscular failure (RIR 0). Useful sparingly, mostly on isolation and machine work, as fatigue rises faster than the benefit.
- term: Double progression
  basic: Keep the same weight and add reps each session. When every set reaches the top of your rep range, add weight and start again from the bottom.
  expert: The NEXT line in a workout applies this with your routine's range (8–12 by default) and target RIR. Sets that hit the top by grinding past the target effort do not earn more load. Increments are 2.5 kg (2 kg for dumbbells) or 5 lb.
- term: PR
  basic: A personal record, meaning more weight, more reps at a weight, or a higher e1RM than ever before on that exercise.
  expert: Checked against all your finished sessions plus the earlier sets of the current one. A first-ever session sets the baseline and shows no PRs. Drop sets and partials never count.
- term: Weight trend
  basic: How fast your body weight is changing per week. For building muscle a slow gain works best; losing fat, a steady drop that keeps your lifts up.
  expert: A least-squares slope over the last 28 days of weigh-ins. Common guidance is roughly +0.25–0.5% of body weight a week for a lean gain and −0.5–1% for a cut; the chart shows a 7-day average to smooth out water.
